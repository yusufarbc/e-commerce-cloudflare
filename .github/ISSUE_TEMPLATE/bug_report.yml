name: 🐛 Bug Report
description: Report a bug or unexpected behavior found in E-Market.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report an issue! Please fill out the form below as thoroughly as possible so we can reproduce and fix the bug quickly.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Briefly describe the bug you encountered.
      placeholder: What happened, on which page, and under what conditions?
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: List the exact steps needed to reproduce the issue on our end.
      placeholder: |
        1. Go to '...' page.
        2. Click the '...' button.
        3. See the '...' error.
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What should have happened instead of the bug?
      placeholder: Describe the correct behavior you expected.
    validations:
      required: true

  - type: dropdown
    id: active_payment_gateway
    attributes:
      label: Active Payment Gateway
      description: If the issue occurred during a payment step, which gateway was active?
      options:
        - Not applicable / Not payment-related
        - Param POS (SOAP)
        - iyzico (REST)
        - PayTR (HMAC Direct)
    validations:
      required: false

  - type: input
    id: node_version
    attributes:
      label: Node.js Version
      placeholder: "e.g. v20.11.0 (output of: node -v)"
    validations:
      required: false

  - type: input
    id: wrangler_version
    attributes:
      label: Cloudflare Wrangler Version
      placeholder: "e.g. wrangler 3.30.0 (output of: npx wrangler --version)"
    validations:
      required: false

  - type: textarea
    id: error_logs
    attributes:
      label: Error Logs & Console Output
      description: Paste any browser console errors or Wrangler terminal output here.
      render: bash
      placeholder: Stack trace or error log goes here...
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues and confirmed this is not a duplicate.
          required: true
        - label: I have reinstalled dependencies cleanly (`npm run install:all`) and restarted the local environment.
          required: true
