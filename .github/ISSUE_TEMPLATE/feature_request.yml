name: 💡 Özellik Önerisi (Feature Request)
description: E-Market'e eklenmesini istediğiniz yeni özellikleri ve geliştirmeleri önerin.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        E-Market projesini geliştirmek için sunduğunuz fikirler için teşekkür ederiz! Lütfen eklenmesini istediğiniz özelliğe ait detayları form üzerinden bizimle paylaşın.

  - type: textarea
    id: problem
    attributes:
      label: Önerinin Çözdüğü Sorun (Problem Statement)
      description: Bu özellik hangi sorunu veya eksikliği gideriyor?
      placeholder: Kısaca bu özelliğe neden ihtiyaç duyulduğunu açıklayın.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Önerilen Çözüm / Geliştirme (Proposed Solution)
      description: Özelliğin nasıl çalışmasını veya nasıl görünmesini öneriyorsunuz?
      placeholder: Eklemek istediğiniz özelliğin işlevini ve akışını detaylandırın.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Değerlendirilen Alternatifler
      description: Düşündüğünüz ama elediğiniz alternatif çözümler varsa belirtin.
      placeholder: Diğer olası yaklaşımlar nelerdir?
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Ek Bağlam ve Görseller
      description: Bu özelliğin yer aldığı mock-up'lar, ekran görüntüleri veya başka bir proje örneği varsa ekleyin.
      placeholder: Buraya link veya görseller ekleyebilirsiniz.
    validations:
      required: false
