name: E-Commerce D1 Database Backup Pipeline

on:
  # Scheduled run disabled for the demo environment to avoid nightly failure emails.
  # Re-enable by uncommenting the schedule trigger below once backups are needed.
  # schedule:
  #   - cron: '0 0 * * *' # Every night at 00:00 UTC
  workflow_dispatch: # Enable manual execution

permissions:
  contents: read

jobs:
  db-backup:
    name: Backup and Export D1 Database
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js Environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.19.5"
          cache: 'npm'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Export D1 Database Content
        run: |
          npx wrangler d1 export ecommerce-d1 --remote --output=d1-backup.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Compress and Encrypt SQL Backup
        run: |
          # Compress to gz
          gzip d1-backup.sql
          
          # Encrypt using GPG with a passphrase secret
          gpg --symmetric --batch --yes --passphrase "$BACKUP_ENCRYPTION_PASSPHRASE" -o d1-backup.sql.gz.gpg d1-backup.sql.gz
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}

      - name: Upload Backup to Google Drive
        run: |
          node scripts/uploadToDrive.js d1-backup.sql.gz.gpg
        env:
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
