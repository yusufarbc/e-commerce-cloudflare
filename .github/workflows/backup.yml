name: D1 Database Backup

# Exports the production D1 database, encrypts it and uploads it to Google Drive.
# See docs/google_drive_backup.md.
on:
  # Scheduled run disabled for the demo environment to avoid nightly failure emails.
  # Re-enable by uncommenting the schedule trigger below once backups are needed.
  # schedule:
  #   - cron: '0 0 * * *' # Every night at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_VERSION: 4.145.0
  D1_DATABASE: ecommerceflaredev-d1-production

jobs:
  db-backup:
    name: Backup and export D1 database
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.3"

      - name: Export D1 database
        run: npx --yes "wrangler@$WRANGLER_VERSION" d1 export "$D1_DATABASE" --remote --output=d1-backup.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The passphrase is passed on stdin, never on the command line.
      - name: Compress and encrypt
        run: |
          gzip d1-backup.sql
          printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            --output d1-backup.sql.gz.gpg d1-backup.sql.gz
          rm -f d1-backup.sql.gz
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}

      - name: Upload backup to Google Drive
        run: node scripts/uploadToDrive.js d1-backup.sql.gz.gpg
        env:
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
