name: E-Commerce D1 Database Backup Pipeline

on:
  schedule:
    - cron: '0 0 * * *' # Every night at 00:00 UTC
  workflow_dispatch: # Enable manual execution

jobs:
  db-backup:
    name: Backup and Export D1 Database
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Export D1 Database Content
        run: |
          npx wrangler d1 export ecommerce-d1 --remote --output=d1-backup.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Compress and Encrypt SQL Backup
        run: |
          # Compress to gz
          gzip d1-backup.sql
          
          # Encrypt using GPG with a passphrase secret
          gpg --symmetric --batch --yes --passphrase "${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}" -o d1-backup.sql.gz.gpg d1-backup.sql.gz
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}

      - name: Upload Backup to Google Drive
        run: |
          node scripts/uploadToDrive.js d1-backup.sql.gz.gpg
        env:
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
