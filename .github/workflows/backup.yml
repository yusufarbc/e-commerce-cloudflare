name: E-Commerce D1 Database Backup Pipeline

on:
  schedule:
    - cron: '0 0 * * *' # Every night at 00:00 UTC
  workflow_dispatch: # Enable manual execution

jobs:
  db-backup:
    name: Backup and Export D1 Database
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Export D1 Database Content
        run: |
          npx wrangler d1 export ecommerce-d1 --remote --output=d1-backup.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Compress and Encrypt SQL Backup
        run: |
          # Compress to gz
          gzip d1-backup.sql
          
          # Encrypt using GPG with a passphrase secret
          gpg --symmetric --batch --yes --passphrase "${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}" -o d1-backup.sql.gz.gpg d1-backup.sql.gz
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}

      - name: Upload Backup to Secure Offsite Storage (S3 Compatibility)
        run: |
          # Use aws cli to upload to secure bucket (Cloudflare R2, Backblaze B2, or AWS S3)
          # Requires AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, and AWS_DEFAULT_REGION configured in secrets
          if [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            aws s3 cp d1-backup.sql.gz.gpg s3://${{ secrets.BACKUP_S3_BUCKET_NAME }}/database/d1-backup-$(date +%Y-%m-%d).sql.gz.gpg --endpoint-url ${{ secrets.BACKUP_S3_ENDPOINT }}
          else
            echo "AWS/S3 credentials not found. Backups can also be securely uploaded to a backup web portal."
            # Fallback upload script to secure API:
            # curl -X POST -H "Authorization: Bearer ${{ secrets.BACKUP_PORTAL_TOKEN }}" -F "file=@d1-backup.sql.gz.gpg" ${{ secrets.BACKUP_PORTAL_UPLOAD_URL }}
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
