name: 🚀 Staging Deployment (test branch only)

on:
  push:
    branches:
      - test
  pull_request:
    branches:
      - test
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and Build Projects
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set Staging API URL
        id: env-setup
        run: |
          echo "VITE_API_URL=https://api.ecommerceflaredev.web.tr" >> $GITHUB_ENV
        shell: bash

      - name: Install All Dependencies
        run: npm run ci:all

      - name: Run Backend Prisma Validation
        run: |
          cd api
          npx prisma validate

      - name: Run ESLint Linter (Storefront)
        run: |
          cd client
          npm run lint

      - name: Run ESLint Linter (Admin Dashboard)
        run: |
          cd admin
          npm run lint

      - name: Run Semgrep SAST Security Scan
        run: |
          pip install semgrep
          semgrep scan --config auto --error

      - name: Build Storefront Client
        run: |
          cd client
          npm run build
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}

      - name: Build Admin Panel
        run: |
          cd admin
          npm run build
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}

      - name: Upload Storefront Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist/

      - name: Upload Admin Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: admin/dist/

  deploy-backend:
    name: Deploy API to Cloudflare Workers (Staging)
    needs: test-and-build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install API Dependencies
        run: |
          cd api
          npm ci

      - name: Run Prisma Client Generation
        run: |
          cd api
          npx prisma generate

      - name: Deploy to Cloudflare Workers (Staging)
        run: |
          cd api
          npx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-frontend:
    name: Deploy Frontends to Cloudflare Pages (Staging)
    needs: [test-and-build, deploy-backend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Storefront Build
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist

      - name: Download Admin Build
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: admin/dist

      - name: Deploy Storefront to Cloudflare Pages (Staging)
        run: |
          npx wrangler pages deploy client/dist --project-name=ecommerce-storefront --branch=test
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Admin Dashboard to Cloudflare Pages (Staging)
        run: |
          npx wrangler pages deploy admin/dist --project-name=ecommerce-admin --branch=test
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
