name: CI/CD Deployment Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test and Build Projects
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install All Dependencies
        run: npm run install:all

      - name: Run Backend Prisma Validation
        run: |
          cd api
          npx prisma validate

      - name: Build Storefront Client
        run: |
          cd client
          npm run build
        env:
          VITE_API_URL: ${{ secrets.PRODUCTION_API_URL }}

      - name: Build Admin Panel
        run: |
          cd admin
          npm run build
        env:
          VITE_API_URL: ${{ secrets.PRODUCTION_API_URL }}

      - name: Upload Storefront Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist/

      - name: Upload Admin Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: admin/dist/

  deploy-backend:
    name: Deploy API to Cloudflare Workers
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install API Dependencies
        run: |
          cd api
          npm install

      - name: Run Prisma Client Generation
        run: |
          cd api
          npx prisma generate

      - name: Deploy to Cloudflare Workers
        run: |
          cd api
          npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-frontend:
    name: Deploy Frontends to Cloudflare Pages
    needs: [test-and-build, deploy-backend]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Storefront Build
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist

      - name: Download Admin Build
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: admin/dist

      - name: Deploy Storefront to Cloudflare Pages
        run: |
          npx wrangler pages deploy client/dist --project-name=ecommerce-storefront --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Admin Dashboard to Cloudflare Pages
        run: |
          npx wrangler pages deploy admin/dist --project-name=ecommerce-admin --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
