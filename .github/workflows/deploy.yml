name: CI/CD Deployment Pipeline

on:
  push:
    branches:
      - main
      - test
  pull_request:
    branches:
      - main
      - test
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test and Build Projects
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Determine Target Environment
        id: env-setup
        run: |
          if [ "${{ github.ref }}" = "refs/heads/test" ] || [ "${{ github.base_ref }}" = "test" ]; then
            echo "VITE_API_URL=${{ secrets.STAGING_API_URL }}" >> $GITHUB_ENV
          else
            echo "VITE_API_URL=${{ secrets.PRODUCTION_API_URL }}" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Install All Dependencies
        run: npm run ci:all

      - name: Run Backend Prisma Validation
        run: |
          cd api
          npx prisma validate

      - name: Run ESLint Linter (Storefront)
        run: |
          cd client
          npm run lint

      - name: Run ESLint Linter (Admin Dashboard)
        run: |
          cd admin
          npm run lint

      - name: Run Semgrep SAST Security Scan
        run: |
          pip install semgrep
          semgrep scan --config auto --error

      - name: Build Storefront Client
        run: |
          cd client
          npm run build
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}

      - name: Build Admin Panel
        run: |
          cd admin
          npm run build
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}

      - name: Upload Storefront Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist/

      - name: Upload Admin Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: admin/dist/

  deploy-backend:
    name: Deploy API to Cloudflare Workers
    needs: test-and-build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Determine Deploy Environment
        id: deploy-env-setup
        run: |
          if [ "${{ github.ref }}" = "refs/heads/test" ]; then
            echo "DEPLOY_ENV=staging" >> $GITHUB_ENV
          else
            echo "DEPLOY_ENV=production" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Install API Dependencies
        run: |
          cd api
          npm ci

      - name: Run Prisma Client Generation
        run: |
          cd api
          npx prisma generate

      - name: Deploy to Cloudflare Workers
        run: |
          cd api
          npx wrangler deploy --env ${{ env.DEPLOY_ENV }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-frontend:
    name: Deploy Frontends to Cloudflare Pages
    needs: [test-and-build, deploy-backend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Storefront Build
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist

      - name: Download Admin Build
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: admin/dist

      - name: Determine Pages Branch Target
        id: pages-target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/test" ]; then
            echo "PAGES_BRANCH=test" >> $GITHUB_ENV
          else
            echo "PAGES_BRANCH=main" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Deploy Storefront to Cloudflare Pages
        run: |
          npx wrangler pages deploy client/dist --project-name=ecommerce-storefront --branch=${{ env.PAGES_BRANCH }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Admin Dashboard to Cloudflare Pages
        run: |
          npx wrangler pages deploy admin/dist --project-name=ecommerce-admin --branch=${{ env.PAGES_BRANCH }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
