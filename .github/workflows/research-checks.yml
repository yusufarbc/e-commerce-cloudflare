name: Research Checks

on:
  pull_request:
    paths:
      - research/serverless-sast-study/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus-and-analysis:
    name: Ground truth schema and analysis tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: research/serverless-sast-study
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"

      - name: Validate ground truth
        run: python -m analysis.groundtruth

      - name: Analysis unit tests
        run: python -m unittest discover -s analysis/tests -t . -v
