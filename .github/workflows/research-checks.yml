name: Research Checks

on:
  pull_request:
    paths:
      - research/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus-and-analysis:
    name: Ground truth schema and analysis tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: research
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"

      - name: Validate ground truth
        run: python -m analysis.groundtruth

      - name: Analysis unit tests
        run: python -m unittest discover -s analysis/tests -t . -v

  exploit-oracles:
    name: Exploit oracles (every vuln case exploitable, every fixed twin resists)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: research/oracles
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: research/oracles/package-lock.json

      - name: Install oracle dependencies
        run: npm ci

      - name: Run oracles
        run: npm test
