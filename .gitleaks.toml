title = "e-commerce-cloudflare gitleaks config"

[extend]
useDefault = true

# CI scans the full git history, so these entries cover files that no longer
# exist in the working tree.
[[allowlists]]
description = "History only: intentionally vulnerable research corpus, moved to its own repository on 2026-10-02"
paths = ['''^research/corpus/''']

[[allowlists]]
description = "Burned demo JWT secret: public in history, rotated and no longer used by the app"
regexTarget = "match"
regexes = ['''secure-admin-token-secret-12345''']

[[allowlists]]
description = "Cloudflare Access application Audience tag: a public identifier (shown in the Access login redirect), not a credential"
regexTarget = "line"
regexes = ['''^ACCESS_AUD = "[0-9a-f]{64}"''']
