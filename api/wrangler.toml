name = "e-commerce-cloudflare"
main = "src/app.js"
compatibility_date = "2024-04-03"
compatibility_flags = [ "nodejs_compat" ]

[vars]
NODE_ENV = "development"
CORS_ORIGIN = "*"
CLIENT_URL = "http://localhost:3000"
API_URL = "http://localhost:8787"
ORDER_NOTIFICATION_EMAIL = "bilgi@e-market-domain.com"
CDN_URL = "https://cdn.e-market-domain.com"
GOOGLE_MERCHANT_TOKEN = "test-token"
ADMIN_JWT_SECRET = "secure-admin-token-secret-12345"

# ── Active Payment Provider ─────────────────────────────────────────────────
# Options: "iyzico" | "param" | "paytr"
PAYMENT_PROVIDER = "iyzico"

# ── iyzico credentials (development sandbox) ─────────────────────────────────
# Secrets (API keys) must be set via: wrangler secret put IYZICO_API_KEY
IYZICO_BASE_URL = "https://sandbox-api.iyzipay.com"

# ── Param POS credentials (disabled - uncomment to switch provider) ──────────
# PARAM_CLIENT_CODE = "test"
# PARAM_CLIENT_USERNAME = "test"
# PARAM_CLIENT_PASSWORD = "test"
# PARAM_GUID = "00000000-0000-0000-0000-000000000000"
# PARAM_BASE_URL = "https://testposws.param.com.tr/turkpos.ws/service_turkpos_prod.asmx?wsdl"

# ── PayTR credentials (disabled - uncomment to switch provider) ──────────────
# PAYTR_MERCHANT_ID = ""
# PAYTR_MERCHANT_KEY = ""
# PAYTR_MERCHANT_SALT = ""

# ── E-posta (SMTP) ───────────────────────────────────────────────────────────
SMTP_SENDER = "E-Market <siparis@e-market-domain.com>"
SMTP_REPLY_TO = "bilgi@e-market-domain.com"

[[d1_databases]]
binding = "DB"
database_name = "ecommerce-d1"
database_id = "9885a04b-194f-4558-9204-bce53057a40f"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "ecommerce-r2"
preview_bucket_name = "ecommerce-r2"

[[send_email]]
name = "EMAIL"

[triggers]
crons = [ "0 2 * * *" ] # Everyday at 02:00 AM UTC

# ========================================================
# ⚙️ Cloudflare Environments Configuration
# ========================================================

# 🧪 Staging (Deployed automatically from 'test' branch)
[env.staging]
name = "e-commerce-cloudflare-staging"

[env.staging.vars]
