name = "e-commerce-cloudflare"
main = "src/app.js"
compatibility_date = "2026-02-01"
compatibility_flags = [ "nodejs_compat" ]

# ========================================================
# Local development (`wrangler dev`) — isolated preview resources only
# ========================================================
[vars]
NODE_ENV = "development"
CORS_ORIGIN = "http://localhost:3000,http://localhost:5173"
CLIENT_URL = "http://localhost:3000"
API_URL = "http://localhost:8787"
ORDER_NOTIFICATION_EMAIL = "siparis@ecommerceflaredev.web.tr"
CDN_URL = "https://cdn.ecommerceflaredev.web.tr"
# Admin access is handled by Cloudflare Access (see middlewares/adminAuth.js).
# Admin routes return 503 until ACCESS_TEAM_DOMAIN and ACCESS_AUD are set.

# ── Active Payment Provider ─────────────────────────────────────────────────
# Options: "iyzico" | "param" | "paytr"
PAYMENT_PROVIDER = "iyzico"

# ── iyzico (sandbox) — API keys via: wrangler secret put IYZICO_API_KEY ─────
IYZICO_BASE_URL = "https://sandbox-api.iyzipay.com"

# ── E-posta (SMTP) ───────────────────────────────────────────────────────────
SMTP_SENDER = "E-Market <siparis@ecommerceflaredev.web.tr>"
SMTP_REPLY_TO = "siparis@ecommerceflaredev.web.tr"

[[d1_databases]]
binding = "DB"
database_name = "ecommerceflaredev-d1-preview"
database_id = "c2bc8863-4c99-4501-86b8-d333b91faa91"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "ecommerceflaredev-r2-preview"
preview_bucket_name = "ecommerceflaredev-r2-preview"

[[send_email]]
name = "EMAIL"

# ========================================================
# 🧪 Staging — deployed from the `staging` branch
# ========================================================
[env.staging]
name = "e-commerce-cloudflare-staging"
routes = [ { pattern = "staging-api.ecommerceflaredev.web.tr", custom_domain = true } ]

[env.staging.vars]
NODE_ENV = "staging"
ACCESS_TEAM_DOMAIN = "nalbur-tech.cloudflareaccess.com"
ACCESS_AUD = "444d0c601d900d5ea914c4334667688e23ae1bb394d12764d485595ea696970b" # Access app "admin"
CORS_ORIGIN = "https://staging.ecommerceflaredev.web.tr,https://staging-admin.ecommerceflaredev.web.tr"
CLIENT_URL = "https://staging.ecommerceflaredev.web.tr"
API_URL = "https://staging-api.ecommerceflaredev.web.tr"
ORDER_NOTIFICATION_EMAIL = "siparis@ecommerceflaredev.web.tr"
CDN_URL = "https://cdn.ecommerceflaredev.web.tr"
PAYMENT_PROVIDER = "iyzico"
IYZICO_BASE_URL = "https://sandbox-api.iyzipay.com"
SMTP_SENDER = "E-Market <siparis@ecommerceflaredev.web.tr>"
SMTP_REPLY_TO = "siparis@ecommerceflaredev.web.tr"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "ecommerceflaredev-d1-staging"
database_id = "46a6d6bb-a337-441c-a734-22696dba985c"
preview_database_id = "c2bc8863-4c99-4501-86b8-d333b91faa91"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "ecommerceflaredev-r2-staging"
preview_bucket_name = "ecommerceflaredev-r2-preview"

[[env.staging.send_email]]
name = "EMAIL"

# Per-client rate limits (Workers Rate Limiting); see src/middlewares/rateLimit.js
[[env.staging.ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1101"
simple = { limit = 300, period = 60 }

[[env.staging.ratelimits]]
name = "SENSITIVE_RATE_LIMITER"
namespace_id = "1102"
simple = { limit = 30, period = 60 }

[env.staging.triggers]
crons = [ "0 2 * * *" ] # Everyday at 02:00 AM UTC

# ========================================================
# 🚀 Production — deployed from the `production` branch
# ========================================================
[env.production]
name = "e-commerce-cloudflare-production"
routes = [ { pattern = "api.ecommerceflaredev.web.tr", custom_domain = true } ]

[env.production.vars]
NODE_ENV = "production"
ACCESS_TEAM_DOMAIN = "nalbur-tech.cloudflareaccess.com"
ACCESS_AUD = "444d0c601d900d5ea914c4334667688e23ae1bb394d12764d485595ea696970b" # Access app "admin"
CORS_ORIGIN = "https://ecommerceflaredev.web.tr,https://admin.ecommerceflaredev.web.tr"
CLIENT_URL = "https://ecommerceflaredev.web.tr"
API_URL = "https://api.ecommerceflaredev.web.tr"
ORDER_NOTIFICATION_EMAIL = "siparis@ecommerceflaredev.web.tr"
CDN_URL = "https://cdn.ecommerceflaredev.web.tr"
PAYMENT_PROVIDER = "iyzico"
IYZICO_BASE_URL = "https://sandbox-api.iyzipay.com"
SMTP_SENDER = "E-Market <siparis@ecommerceflaredev.web.tr>"
SMTP_REPLY_TO = "siparis@ecommerceflaredev.web.tr"

[[env.production.d1_databases]]
binding = "DB"
database_name = "ecommerceflaredev-d1-production"
database_id = "a64b896c-8302-4bf5-8fa2-0e1a488f2589"
preview_database_id = "c2bc8863-4c99-4501-86b8-d333b91faa91"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "ecommerceflaredev-r2-production"
preview_bucket_name = "ecommerceflaredev-r2-preview"

[[env.production.send_email]]
name = "EMAIL"

# Per-client rate limits (Workers Rate Limiting); see src/middlewares/rateLimit.js
[[env.production.ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1201"
simple = { limit = 300, period = 60 }

[[env.production.ratelimits]]
name = "SENSITIVE_RATE_LIMITER"
namespace_id = "1202"
simple = { limit = 30, period = 60 }

[env.production.triggers]
crons = [ "0 2 * * *" ] # Everyday at 02:00 AM UTC
